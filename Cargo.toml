[package]
name = "todo"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.100"

[dependencies]
elephantry = { version = "6.0", features = ["rocket"] }
rocket = "0.5"

[dev-dependencies]
parking_lot = "0.13"
rand = "0.10"

[dependencies.rocket_sync_db_pools]
version = "0.1"

[dependencies.rocket_dyn_templates]
version = "0.3"
features = ["tera"]

[workspace.metadata.local-install]
elephantry-cli = "3.0"
